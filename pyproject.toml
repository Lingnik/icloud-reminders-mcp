[project]
name = "icloud-reminders-mcp"
version = "0.1.0"
description = "MCP server for Apple Reminders over iCloud CalDAV (VTODO), no Mac required"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Taylor Meek" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.28,<2",
    "caldav>=3.2,<4",
    "icalendar>=6,<8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Lingnik/icloud-reminders-mcp"
Issues = "https://github.com/Lingnik/icloud-reminders-mcp/issues"

[project.scripts]
icloud-reminders-mcp = "icloud_reminders_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/icloud_reminders_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
